[build-system]
requires = ["setuptools>=64.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "earthscope-positions"
description = "Pull GNSS position data from the EarthScope API and store it locally"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Charlie Sievers", email = "charlie.sievers@earthscope.org"}]
license = {text = "MIT"}
dynamic = ["version"]

dependencies = [
    # EarthScope
    "earthscope-sdk>=1.6.1",
    "earthscope-cli>=1.2.0",

    # Kafka
    "confluent-kafka>=2.0.0",

    # HTTP / serialization
    "requests>=2.31.0",
    "orjson>=3.9.0",

    # Arrow / columnar storage
    "pyarrow>=12.0.0",

    # Utilities
    "pydantic>=2.0.0",

    # Analysis and plotting (used by positions_diagnose_plot)
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.11.0",  # Welch/coherence spectral estimation (positions coherence analysis)

    # Web server
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "responses>=0.25.0",   # intercept `requests` calls (positions fetch API)
]

[project.scripts]
es-pos = "earthscope_positions.es_pos:main"
inspect = "earthscope_positions.arrow_inspect:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "post-release"
write_to = "src/earthscope_positions/_version.py"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
# No test may reach the network. `responses` (used by the fetch tests) already
# blocks unregistered `requests` calls; this keeps the intent explicit.
markers = [
    "network: test that is allowed to hit the real network (deselected by default)",
]
